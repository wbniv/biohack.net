<circle class="dtv" cx="32" cy="580" r="6"/><text class="legend" x="45" y="584">visa selection</text>
<circle class="ed" cx="102" cy="580" r="6"/><text class="legend" x="115" y="584">Non-ED / study</text>
<circle class="cat" cx="228" cy="580" r="6"/><text class="legend" x="241" y="584">cat</text>
<circle class="tax" cx="292" cy="580" r="6"/><text class="legend" x="305" y="584">tax gate</text>
<circle class="travel" cx="372" cy="580" r="6"/><text class="legend" x="385" y="584">travel</text>
<circle class="ring" stroke="#57534e" cx="470" cy="580" r="6"/><text class="legend" x="483" y="584">target / decision gate</text>
<text class="sub" x="1170" y="584" text-anchor="end">Working plan · 6 Aug 2026</text>
</svg>
